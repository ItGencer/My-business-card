<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Business Card</title>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a href="/" class="header__logo">
          <span class="header__logo-avatar">AH</span>
          <span class="header__logo-name">Artem Hrishyn</span>
        </a>

        <nav class="header__nav">
          <a href="#about" class="header__nav-link">Про мене</a>
          <a href="#skills" class="header__nav-link">Навички</a>
          <a href="#services" class="header__nav-link">Послуги</a>
          <a href="#portfolio" class="header__nav-link">Портфоліо</a>
          <a href="#contact" class="header__nav-link">Контакти</a>
        </nav>

        <div class="header__actions">
          <button class="header__btn header__btn--lang">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path
                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                       15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
              />
            </svg>
            UA
          </button>
          <button
            class="header__btn header__btn--theme"
            aria-label="Змінити тему"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="intro__container">
          <!-- Ліва частина: текст -->
          <div class="intro__content">
            <p class="intro__name">Artem Hrishyn · Артем Гришин</p>
            <h1 class="intro__title">Front-end<br />Розробник</h1>
            <p class="intro__subtitle">
              Відповідальний підхід — якісний результат
            </p>
            <p class="intro__subtitle intro__subtitle--en">
              Responsible approach — quality result
            </p>

            <div class="intro__actions">
              <a href="#works" class="intro__btn intro__btn--primary"
                >Переглянути роботи</a
              >
              <a href="#contact" class="intro__btn intro__btn--secondary"
                >Зв'язатися</a
              >
            </div>
          </div>

          <!-- Права частина: фото -->
          <div class="intro__photo-wrap">
            <div class="intro__glow"></div>
            <div class="intro__photo">
              <img
                src="https://i.pravatar.cc/400?img=11"
                alt="Артем Гришин"
                class="intro__photo-img"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
